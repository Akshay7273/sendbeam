name: Scrub retired domain from release assets

# One-off maintenance workflow. Rewrites SBOMs, deb control fields, and bundled
# READMEs inside published release assets to repoint the retired demo domain at
# the GitHub repository, then regenerates and re-signs SHA256SUMS with the same
# minisign key used by the release pipeline, so existing verification flows keep
# working. Update-channel manifests (stable.json / beta.json) are regenerated
# from the new checksums and re-signed the same way. Binaries are not modified.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to scrub (e.g. v2.2.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (scrub + verify locally, no upload)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Check signing prerequisites
        run: |
          if [ -z "${{ secrets.MINISIGN_SECRET_KEY }}" ]; then
            echo "[-] ERROR: MINISIGN_SECRET_KEY secret is required for re-signing!" >&2
            exit 1
          fi
          test -f minisign.pub || { echo "[-] minisign.pub missing from repo root" >&2; exit 1; }
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.work
          cache: false

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p work
          cd work
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" --clobber
          rm -f SHA256SUMS.txt SHA256SUMS.txt.minisig SHA256SUMS.txt.sigstore.json \
                stable.json beta.json stable.json.minisig beta.json.minisig
          echo "=== assets downloaded (regenerated originals removed) ==="
          ls -la

      - name: Scan assets (before)
        working-directory: work
        run: |
          hits=0
          for f in *.tar.gz; do
            n=$(zcat "$f" 2>/dev/null | grep -a -c omnitrix || true); echo "$f: $n hits"
            hits=$((hits + n))
          done
          for f in *.zip; do
            rm -rf .scan && mkdir .scan && unzip -q "$f" -d .scan 2>/dev/null
            n=$(grep -rli omnitrix .scan 2>/dev/null | wc -l); echo "$f: $n file(s)"
            hits=$((hits + n)); rm -rf .scan
          done
          for f in *.spdx.json; do
            n=$(grep -a -c omnitrix "$f" || true); echo "$f: $n hits"; hits=$((hits + n))
          done
          for f in *.deb; do
            rm -rf .scan && mkdir .scan && cd .scan
            ar x "../$f"
            for t in control.tar.* data.tar.*; do
              case "$t" in
                *.zst) tar --zstd -xf "$t" ;;
                *.xz)  tar -xJf "$t" ;;
                *.gz)  tar -xzf "$t" ;;
              esac
            done
            n=$(grep -rli omnitrix . 2>/dev/null | wc -l); echo "$f: $n file(s)"
            hits=$((hits + n)); cd ..; rm -rf .scan
          done
          echo "TOTAL pre-scrub hits: $hits"
          echo "PRE_HITS=$hits" >> "$GITHUB_ENV"

      - name: Scrub SBOMs
        working-directory: work
        run: |
          set -euo pipefail
          for f in *.spdx.json; do
            sed -i -e 's|https://omnitrix\.space|https://github.com/Akshay7273/sendbeam|g' -e 's|omnitrix\.space|github.com/Akshay7273/sendbeam|g' "$f"
            python3 -m json.tool "$f" > /dev/null
          done
          ! grep -a -q omnitrix *.spdx.json || { echo "[-] SBOM still dirty" >&2; exit 1; }
          echo "SBOMs clean"

      - name: Scrub .deb control fields
        working-directory: work
        run: |
          set -euo pipefail
          for f in *.deb; do
            rm -rf .stage && mkdir .stage && cd .stage
            ar x "../$f"
            ctrl_t=$(ls control.tar.* | head -1)
            data_t=$(ls data.tar.* | head -1)
            case "$ctrl_t" in
              *.zst) dec="tar --zstd -xf"; enc="tar --zstd -cf" ;;
              *.xz)  dec="tar -xJf";          enc="tar -cJf" ;;
              *.gz)  dec="tar -xzf";          enc="tar -czf" ;;
              *) echo "[-] unknown control compression: $ctrl_t" >&2; exit 1 ;;
            esac
            mkdir ctrl && $dec "$ctrl_t" -C ctrl
            sed -i -e 's|https://omnitrix\.space|https://github.com/Akshay7273/sendbeam|g' -e 's|omnitrix\.space|github.com/Akshay7273/sendbeam|g' ctrl/control
            $enc "$ctrl_t" -C ctrl .
            ar rc "../$f.new" debian-binary "$ctrl_t" "$data_t"
            cd ..
            mv "$f.new" "$f"
            rm -rf .stage
          done
          for f in *.deb; do
            rm -rf .v && mkdir .v && cd .v
            ar x "../$f"
            for t in control.tar.* data.tar.*; do
              case "$t" in
                *.zst) tar --zstd -xf "$t" ;;
                *.xz)  tar -xJf "$t" ;;
                *.gz)  tar -xzf "$t" ;;
              esac
            done
            n=$(grep -rli omnitrix . 2>/dev/null | wc -l || true)
            [ "$n" = "0" ] || { echo "[-] $f still dirty ($n files)" >&2; exit 1; }
            cd .. && rm -rf .v
          done
          echo "debs clean and rebuilt"

      - name: Scrub READMEs inside CLI tarballs
        working-directory: work
        run: |
          set -euo pipefail
          for f in sendbeam-cli-*.tar.gz; do
            members=$(tar -tzf "$f")
            rm -rf .t && mkdir .t
            tar -xzf "$f" -C .t
            find .t -name 'README.md' -exec sed -i -e 's|https://omnitrix\.space|https://github.com/Akshay7273/sendbeam|g' -e 's|omnitrix\.space|github.com/Akshay7273/sendbeam|g' {} +
            (cd .t && printf '%s\n' "$members" | tar -czf "../$f.new" -T -)
            mv "$f.new" "$f"
            rm -rf .t
          done
          for f in sendbeam-cli-*.tar.gz; do
            n=$(zcat "$f" | grep -a -c omnitrix || true)
            [ "$n" = "0" ] || { echo "[-] $f still dirty ($n)" >&2; exit 1; }
          done
          echo "tarballs clean"

      - name: Scrub READMEs inside zip archives
        working-directory: work
        run: |
          set -euo pipefail
          for f in *.zip; do
            rm -rf .z && mkdir .z
            zipinfo -1 "$f" > .z/members.txt
            unzip -q "$f" -d .z
            find .z -name 'README.md' -not -path '*/.z/members.txt' \
              -exec sed -i -e 's|https://omnitrix\.space|https://github.com/Akshay7273/sendbeam|g' -e 's|omnitrix\.space|github.com/Akshay7273/sendbeam|g' {} +
            (cd .z && zip -q -X "../$f.new" -@ < members.txt)
            mv "$f.new" "$f"
            rm -rf .z
          done
          for f in *.zip; do
            rm -rf .z && mkdir .z && unzip -q "$f" -d .z
            n=$(grep -rli omnitrix .z 2>/dev/null | wc -l || true)
            [ "$n" = "0" ] || { echo "[-] $f still dirty ($n files)" >&2; exit 1; }
            rm -rf .z
          done
          echo "zips clean"

      - name: Scan assets (after)
        working-directory: work
        run: |
          hits=0
          for f in *.tar.gz; do
            n=$(zcat "$f" 2>/dev/null | grep -a -c omnitrix || true); hits=$((hits + n))
          done
          for f in *.zip; do
            rm -rf .scan && mkdir .scan && unzip -q "$f" -d .scan 2>/dev/null
            n=$(grep -rli omnitrix .scan 2>/dev/null | wc -l); hits=$((hits + n)); rm -rf .scan
          done
          for f in *.spdx.json *.json *.txt; do
            n=$(grep -a -c omnitrix "$f" 2>/dev/null || true); hits=$((hits + n))
          done
          for f in *.deb; do
            rm -rf .scan && mkdir .scan && cd .scan
            ar x "../$f"
            for t in control.tar.* data.tar.*; do
              case "$t" in
                *.zst) tar --zstd -xf "$t" ;;
                *.xz)  tar -xJf "$t" ;;
                *.gz)  tar -xzf "$t" ;;
              esac
            done
            n=$(grep -rli omnitrix . 2>/dev/null | wc -l); hits=$((hits + n))
            cd .. && rm -rf .scan
          done
          echo "POST_HITS=$hits" >> "$GITHUB_ENV"
          echo "post-scrub residual hits (excluding binaries): $hits"
          if [ "$hits" != "0" ]; then
            echo "[-] residual hits remain, refusing to continue" >&2
            exit 1
          fi

      - name: Regenerate SHA256SUMS
        working-directory: work
        run: |
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Sign SHA256SUMS (Minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        working-directory: work
        run: |
          go run ../scripts/minisign.go sign \
            -m SHA256SUMS.txt \
            -p ../minisign.pub \
            -x SHA256SUMS.txt.minisig \
            -t "timestamp:$(date +%s) file:SHA256SUMS.txt scrub:1"
          test -f SHA256SUMS.txt.minisig
          echo "=== minisign self-verify ==="
          go run ../scripts/minisign.go verify \
            -p ../minisign.pub -m SHA256SUMS.txt -x SHA256SUMS.txt.minisig

      - name: Sign SHA256SUMS (Sigstore Cosign keyless)
        working-directory: work
        run: |
          cosign sign-blob --yes \
            --bundle SHA256SUMS.txt.sigstore.json \
            SHA256SUMS.txt
          test -f SHA256SUMS.txt.sigstore.json

      - name: Regenerate update channel manifests
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          mkdir -p updates
          go run ./scripts/generate-update-manifest.go \
            --version "$VERSION" \
            --tag "${{ inputs.tag }}" \
            --channel "auto" \
            --sums work/SHA256SUMS.txt \
            --dir work \
            --pubkey minisign.pub \
            --out updates
          ls -la updates
          cp updates/* work/
          echo "=== verify manifests reference new sums and are signed ==="
          python3 -c '
          import json
          sums = {}
          for line in open("work/SHA256SUMS.txt"):
              h, n = line.split(maxsplit=1)
              sums[n.strip()] = h
          for mf in ("work/stable.json", "work/beta.json"):
              d = json.load(open(mf))
              ch = mf.split("/")[-1].split(".")[0]
              assert d["channel"] == ch, mf
              missing = [k for k in d.get("assets", {}) if "." in k and k not in sums]
              assert not missing, mf + ": missing " + str(missing)
              print(mf + ": " + str(len(d.get("assets", {}))) + " assets, all in new SHA256SUMS")
          '
          for ch in stable beta; do
            if [ -f "work/$ch.json" ]; then
              test -f "work/$ch.json.minisig" || { echo "[-] $ch.json unsigned" >&2; exit 1; }
              go run ./scripts/minisign.go verify \
                -p minisign.pub -m "work/$ch.json" -x "work/$ch.json.minisig"
            fi
          done

      - name: Validate checksums
        working-directory: work
        run: sha256sum -c SHA256SUMS.txt

      - name: Upload scrubbed assets
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd work
          gh release upload "${{ inputs.tag }}" * \
            --repo "${{ github.repository }}" --clobber
          echo "=== upload complete, release now has: ==="
          gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'

      - name: Summary
        run: |
          {
            echo "## Scrub report — ${{ inputs.tag }}"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Pre-scrub domain hits | ${{ env.PRE_HITS }} |"
            echo "| Post-scrub residual hits | ${{ env.POST_HITS }} |"
            echo "| Dry run | ${{ inputs.dry_run }} |"
            echo "| SHA256SUMS re-signed | yes (minisign + cosign) |"
          } >> "$GITHUB_STEP_SUMMARY"
