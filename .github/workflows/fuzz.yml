name: fuzz

on:
  schedule:
    # Nightly continuous fuzzing at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration to fuzz each target (e.g. 1m, 3m, 5m, 10m)'
        required: false
        default: '3m'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: ${{ matrix.target }} (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # packages/wire targets
          - module: packages/wire
            pkg: .
            target: FuzzDecodeControl
          - module: packages/wire
            pkg: .
            target: FuzzDecodeFrameHeader
          - module: packages/wire
            pkg: .
            target: FuzzOpenSequenced
          - module: packages/wire
            pkg: .
            target: FuzzValidateManifest
          - module: packages/wire
            pkg: .
            target: FuzzDecodeManifestShape
          - module: packages/wire
            pkg: .
            target: FuzzNormalizeTransferPath
          - module: packages/wire
            pkg: .
            target: FuzzPaddingCodec
          - module: packages/wire
            pkg: .
            target: FuzzRevocationRecord
          - module: packages/wire
            pkg: .
            target: FuzzPairingMessage
          - module: packages/wire
            pkg: .
            target: FuzzTrustedAuthMessage
          - module: packages/wire
            pkg: .
            target: FuzzDecodeJournal
          - module: packages/wire
            pkg: .
            target: FuzzWordsCode

          # packages/engine targets
          - module: packages/engine
            pkg: ./rendezvous
            target: FuzzUnmarshalMessage
          - module: packages/engine
            pkg: ./transfer
            target: FuzzDurableJournalApply
          - module: packages/engine
            pkg: ./trust
            target: FuzzDecodeTrustRecord
          - module: packages/engine
            pkg: ./trust
            target: FuzzFileTrustStoreLoad
          - module: packages/engine
            pkg: ./updater
            target: FuzzParseChannelManifest
          - module: packages/engine
            pkg: ./updater
            target: FuzzParseChecksums

          # apps/server targets
          - module: apps/server
            pkg: ./internal/signal
            target: FuzzClientMsg
          - module: apps/server
            pkg: ./internal/signal
            target: FuzzServerMessageValidation
          - module: apps/server
            pkg: ./internal/signal
            target: FuzzParseTrustedProxies
          - module: apps/server
            pkg: ./internal/signal
            target: FuzzClientIP

    env:
      GOWORK: off
    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.25'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run Fuzz Target
        run: |
          DURATION="${{ inputs.duration || '3m' }}"
          echo "==> Running ${{ matrix.target }} in ${{ matrix.module }} (${{ matrix.pkg }}) for $DURATION..."
          set +e
          go test -run="^${{ matrix.target }}$" -fuzz="^${{ matrix.target }}$" -fuzztime="$DURATION" -v "${{ matrix.pkg }}" 2>&1 | tee fuzz.log
          TEST_EXIT=${PIPESTATUS[0]}
          if [ $TEST_EXIT -ne 0 ]; then
            # If the exit was caused by the coordinator context deadline expiring at the conclusion of fuzztime with no crasher files, treat as clean.
            if grep -q "context deadline exceeded" fuzz.log && ! grep -q "Failing input written" fuzz.log; then
              echo "==> Target ran for full duration ($DURATION) without crashing inputs."
              exit 0
            fi
            exit $TEST_EXIT
          fi

      - name: Upload Crashing Inputs
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: ${{ matrix.module }}/testdata/fuzz/${{ matrix.target }}/
          retention-days: 14

  differential-nightly:
    name: differential-parity-10k (Go <-> TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.25'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build protocol package
        run: pnpm --filter @sendbeam/protocol build

      - name: Run 10k Differential Pass
        run: ./scripts/run_differential.sh 10000 1337
