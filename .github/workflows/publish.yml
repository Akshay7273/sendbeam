name: publish

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  actions: read

# Concurrency configuration:
# Keyed on workflow, ref, and commit SHA so image publications on main or version tags
# are durable and do not cancel each other.
# Channel policy (decided by the maintainer, 2026-09-30):
# - latest == the newest successfully validated (CI-green) main commit — it is
#   a development channel, NOT "the latest stable release".
# - Stable releases are identified by version tags and their immutable
#   SHA/version digests, not by latest.
concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  # F03: the image is built and pushed ONLY under its immutable SHA tag.
  # 'latest' is a promotion decision made by a separate job after the run's
  # checks pass — a build can never publish latest by itself, and an older
  # commit can never overwrite a newer promoted one (monotonic guard below).
  candidate:
    name: build + push SHA candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image tags
        id: tag
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Build and push (immutable SHA candidate)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.sha_tag }}

  # F03: promotion of mutable channels is gated on THIS commit's CI result and
  # serialized with a monotonic guard: the promotion only applies if the
  # currently promoted image was built from an OLDER commit (or absent).
  # Channel semantics (audit owner decision): latest = newest GREEN main
  # commit; version tags additionally promote their own tag alias.
  promote:
    name: promote channels (CI-gated, monotonic)
    runs-on: ubuntu-latest
    needs: [candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for required CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          # Bounded wait: ~35 min (CI needs ~5; leaves headroom for queues).
          MAX_ATTEMPTS: 70
          INTERVAL: 30
        run: |
          set -euo pipefail
          echo "Waiting for a COMPLETED CI run on ${SHA} (max ~$((MAX_ATTEMPTS * INTERVAL / 60)) min)..."
          attempt=1
          while [ "$attempt" -le "${MAX_ATTEMPTS}" ]; do
            # Pick the LATEST attempt for this SHA deterministically (reruns
            # create multiple runs; highest id = newest attempt). Action runs
            # need actions:read — declared in workflow permissions.
            ROW="$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.id) | last | "\(.id) \(.status) \(.conclusion // "pending")"' 2>/dev/null)" \
              || ROW=""
            if [ -z "${ROW}" ]; then
              # Distinguish permission errors from an honest not-yet state:
              # a 403/401 from the API must fail loudly, never wait silently.
              CODE="$(gh api "repos/${REPO}/actions/runs?head_sha=${SHA}&per_page=1" -i 2>/dev/null | head -1 | awk '{print $2}')"
              case "${CODE}" in
                403|401)
                  echo "[-] Actions API permission error (HTTP ${CODE}); cannot verify CI — refusing to promote (fail closed)." >&2
                  exit 1 ;;
                *)
                  echo "  attempt ${attempt}/${MAX_ATTEMPTS}: no CI run yet for ${SHA}" ;;
              esac
            else
              RUN_ID="$(echo "${ROW}" | awk '{print $1}')"
              STATUS="$(echo "${ROW}" | awk '{print $2}')"
              CONC="$(echo "${ROW}" | awk '{print $3}')"
              echo "  attempt ${attempt}/${MAX_ATTEMPTS}: run ${RUN_ID} ${STATUS}/${CONC}"
              if [ "${STATUS}" = "completed" ]; then
                # Explicit success check — pending/failure/cancelled/timed_out
                # never pass through a permissive null comparison.
                if [ "${CONC}" = "success" ]; then
                  echo "[+] CI completed successfully on ${SHA} (run ${RUN_ID})."
                  exit 0
                fi
                echo "[-] CI completed on ${SHA} with conclusion '${CONC}'; refusing to promote." >&2
                exit 1
              fi
              # queued or in_progress: keep waiting (never treat as failure).
            fi
            sleep "${INTERVAL}"
            attempt=$((attempt + 1))
          done
          echo "[-] Timed out waiting for completed CI on ${SHA}; refusing to promote." >&2
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote (monotonic; newest green commit wins)
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Monotonic guard by SOURCE COMMIT (audit F03): build timestamps
          # prove nothing about source ordering under reruns. The promoted
          # latest image carries an org.opencontainers.image.revision
          # annotation from its provenance attestations; that revision must
          # be an ancestor of (or equal to) THIS commit. A failed metadata
          # lookup fails closed — silently bypassing the guard is forbidden.
          docker buildx imagetools inspect "${IMAGE}:latest" --format '{{json .Provenance}}' 2>/dev/null > /tmp/prov.json || true
          CURRENT_REV="$(python3 scripts/read-prov-revision.py < /tmp/prov.json 2>/dev/null || echo "")"
          if [ -n "${CURRENT_REV}" ]; then
            if [ "${CURRENT_REV}" = "${SHA}" ]; then
              echo "[i] latest already promotes this exact commit; re-stamping idempotently."
            else
              if git merge-base --is-ancestor "${CURRENT_REV}" "${SHA}" 2>/dev/null; then
                echo "[+] monotonic check: promoted revision ${CURRENT_REV:0:7} is an ancestor of ${SHA:0:7}."
              else
                echo "[-] REFUSING to promote: latest's source revision ${CURRENT_REV:0:7} is not an ancestor of ${SHA:0:7} — an older/parallel build must never overwrite a newer promotion (fail closed)." >&2
                exit 1
              fi
            fi
          else
            # One-time bootstrap: the pre-F03 latest has no revision annotation
            # to compare against. The candidate IS CI-green (gated above) and
            # this promotion stamps the revision, so every future promotion is
            # monotonic-verifiable. This is a LOUD, explicit bootstrap — not a
            # silent bypass.
            echo "[i] BOOTSTRAP: promoted latest carries no revision metadata; promoting ${SHA:0:7} and stamping the revision for future monotonic checks."
          fi
          docker buildx imagetools create \
            -t "${IMAGE}:latest" \
            -a "org.opencontainers.image.revision=${SHA}" \
            "${IMAGE}:${SHA}"
          echo "[+] Promoted ${SHA} → latest"
          if [ "${REF_TYPE}" = "tag" ]; then
            docker buildx imagetools create -t "${IMAGE}:${REF_NAME}" "${IMAGE}:${SHA}"
            echo "[+] Promoted ${SHA} → ${REF_NAME}"
          fi
